name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    # Local database for build + e2e smoke tests: the app's Neon serverless
    # driver speaks HTTP, so a proxy translates it to plain Postgres.
    # No secrets anywhere — dependabot PRs (which get none) run identically.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: main
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      neon-proxy:
        image: ghcr.io/timowilhelm/local-neon-http-proxy:main
        env:
          PG_CONNECTION_STRING: postgres://postgres:postgres@postgres:5432/main
        ports:
          - 4444:4444

    env:
      DATABASE_URL: postgres://postgres:postgres@db.localtest.me:5432/main
      NEON_HTTP_PROXY_URL: http://localhost:4444/sql
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      GOOGLE_CLIENT_EMAIL: placeholder@example.iam.gserviceaccount.com
      GOOGLE_PRIVATE_KEY: placeholder
      RESEND_API_KEY: resend_placeholder
      AUTH_SECRET: e2e-dummy-auth-secret
      AUTH_TRUST_HOST: "true"
      ADMIN_PASSWORD: e2e-admin-password

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Audit runs as its own step below; skip npm ci's implicit one
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Gate on critical only: high advisories currently exist in postcss/
      # sharp versions pinned inside next itself — unfixable downstream, and
      # gating on them would block every PR until next ships a fix.
      - name: Audit for vulnerabilities
        run: npm audit --audit-level=critical

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Prepare database for the Neon proxy
        run: |
          psql "postgres://postgres:postgres@localhost:5432/main" -c "
            CREATE SCHEMA IF NOT EXISTS neon_control_plane;
            CREATE TABLE IF NOT EXISTS neon_control_plane.endpoints (
              endpoint_id VARCHAR(255) PRIMARY KEY,
              allowed_ips VARCHAR(255)
            );"

      - name: Cache Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', '*.ts') }}
          restore-keys: |
            nextjs-${{ hashFiles('package-lock.json') }}-
            nextjs-

      - name: Build
        run: npm run build

      - name: Seed database
        run: npm run seed

      - name: Get Playwright version
        run: echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_ENV"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ env.PLAYWRIGHT_VERSION }}

      # On cache hit the apt system-deps install (~20s) is skipped too: the
      # runner image already ships the Chromium headless-shell libraries.
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        run: npm run test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
